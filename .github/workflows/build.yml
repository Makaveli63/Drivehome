name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Vérifier le SDK Android (préinstallé sur GitHub)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools" || true

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Préparer la clé de signature (si configurée)
        env:
          SIGNING_KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
        run: |
          if [ -n "$SIGNING_KEYSTORE_B64" ]; then
            echo "$SIGNING_KEYSTORE_B64" | base64 -d > app/release.keystore
          fi

      - name: Compiler l'APK
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
          SIGNING_ALIAS: ${{ secrets.SIGNING_ALIAS }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Renommer l'APK
        run: cp app/build/outputs/apk/release/app-release.apk DriveHome.apk

      - name: Publier l'APK (artefact)
        uses: actions/upload-artifact@v4
        with:
          name: DriveHome-apk
          path: DriveHome.apk

      - name: Publier l'APK (release téléchargeable)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: DriveHome ${{ github.run_number }} (${{ github.ref_name }})
          body: "APK prêt à installer sur l'autoradio : télécharge **DriveHome.apk** ci-dessous."
          files: DriveHome.apk
          make_latest: true
